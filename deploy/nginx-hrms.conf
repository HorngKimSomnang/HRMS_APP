# Nginx server block for HRMS on a single EC2 instance.
# - Serves the built React admin panel (static files) at /
# - Proxies /api and /sanctum to Laravel (PHP-FPM) via public/index.php
#
# Install:
#   sudo cp deploy/nginx-hrms.conf /etc/nginx/sites-available/hrms
#   sudo ln -s /etc/nginx/sites-available/hrms /etc/nginx/sites-enabled/hrms
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot (see DEPLOY_AWS.md) to add HTTPS — it rewrites this file
# to add the 443 block and redirect 80 -> 443 automatically.

server {
    listen 80;
    server_name your-domain.com;

    # Laravel lives here; its public/ is the docroot for API requests.
    root /var/www/hrms/LARAVEL/public;
    index index.php;

    # Built React panel (output of `npm run build`, copied to /var/www/hrms/web)
    location / {
        root /var/www/hrms/web;
        try_files $uri $uri/ /index.html;   # SPA fallback for client-side routing
    }

    # Laravel API + auth routes
    location ~ ^/(api|sanctum|storage) {
        root /var/www/hrms/LARAVEL/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;   # match installed PHP version
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }

    # Allow larger uploads (documents/photos)
    client_max_body_size 25M;

    location ~ /\.(?!well-known).* { deny all; }
}
